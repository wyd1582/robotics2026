[project]
name = "robot-learning-loops"
version = "0.1.0"
description = "Small end-to-end robot learning experiments: imitation, RL, and learned dynamics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.9,<4",
  "torch>=2.10,<3",
  "gymnasium[mujoco,classic-control]>=1.1,<2",
  "stable-baselines3>=2.7,<3",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbclient>=0.10,<1"]

[tool.ruff.lint.isort]
known-first-party = ["common", "course_utils", "frontier", "loop01_imitation", "loop02_reinforcement", "loop03_world_model"]
